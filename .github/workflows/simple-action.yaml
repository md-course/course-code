name: Simple Action
on: [push]

jobs:
    simple-action:
        runs-on: ubuntu-latest
        steps:
            - name: Simple JS Action
              id: greeting
              uses: actions/hello-world-javascript-action@main
              with:
                who-to-greet: 'Greet from workflow file'
            - name: Log Greeting Time
              run: echo "${{ steps.greeting.outputs.time }}"